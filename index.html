

<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishna Hindi Typing Pro</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    text-align:center;
}

.container{
    max-width:500px;
    margin:40px auto;
    background:white;
    color:black;
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 20px rgba(0,0,0,.3);
}

h1{
    color:white;
    margin-top:30px;
}

#word{
    font-size:30px;
    font-weight:bold;
    color:#2563eb;
    margin:20px 0;
}

input{
    width:90%;
    padding:12px;
    font-size:20px;
    border-radius:10px;
    border:2px solid #2563eb;
}

button{
    margin-top:15px;
    padding:12px 25px;
    font-size:18px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:30px;
}

#result{
    margin-top:20px;
    font-size:20px;
    color:green;
}

#score{
    font-size:25px;
    color:red;
}
</style>

</head>

<body>

<h1>🌟 Krishna Hindi Typing Pro 🌟</h1>

<div class="container">

<h2>Typing Practice</h2>

<p id="word"></p>

<input
id="input"
placeholder="यहाँ हिन्दी टाइप करें">

<br>

<button onclick="check()">
Submit
</button>

<h2>
Score :
<span id="score">0</span>
</h2>

<p id="result"></p>

</div>

<script src="script.js"></script>

</body>
</html>
