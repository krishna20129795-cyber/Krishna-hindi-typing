<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishna Hindi Typing Pro</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:white;
text-align:center;
}

header{
padding:40px 20px;
}

h1{
font-size:40px;
margin:10px;
}

p{
font-size:18px;
}

.box{
background:white;
color:#222;
margin:25px;
padding:20px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,.2);
}

button{
padding:15px 30px;
font-size:18px;
border:none;
border-radius:30px;
background:#2563eb;
color:white;
cursor:pointer;
margin:10px;
}

button:hover{
background:#1d4ed8;
}

footer{
margin-top:30px;
padding:20px;
font-size:14px;
}
</style>

</head>

<body>

<header>

<h1>🌟 Krishna Hindi Typing Pro</h1>

<p>बच्चों के लिए मजेदार हिन्दी टाइपिंग वेबसाइट</p>

<button onclick="start()">🚀 Start Practice</button>

</header>

<div class="box">

<h2>Typing Practice</h2>

<p id="word">नमस्ते</p>

<input id="input" placeholder="यहाँ हिन्दी टाइप करें">

<br><br>

<button onclick="check()">Submit</button>

<h3 id="result"></h3>

</div>

<footer>

Made with ❤️ by Krishna

</footer>

<script>

function start(){
alert("Typing Practice जल्द शुरू होगी");
}

function check(){

let w=document.getElementById("word").innerText;

let i=document.getElementById("input").value;

if(i==w){

document.getElementById("result").innerHTML="✅ सही लिखा";

}else{

document.getElementById("result").innerHTML="❌ फिर से कोशिश करें";

}

}

</script>

</body>
</html>
